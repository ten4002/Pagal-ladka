<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />
    <link rel="stylesheet" href="style.css" />

  <body>
    <div class="hearts" aria-hidden="true">
      <span class="heart h1">♡</span>
      <span class="heart h2">♥</span>
      <span class="heart h3">♡</span>
    </div>

    <main class="scrapbook-page">
      <section class="page-paper">
        <div class="washi-tape tape-left"></div>
        <div class="washi-tape tape-right"></div>
        <p class="handwritten intro">A little gallery of our moments</p>
        <h2>Polaroid Memories</h2>
        <p>
          These are the quiet little snapshots that still carry the same warmth whenever I think of you.
        </p>

        <div class="photo-grid">
          <div class="photo-card"><img src="Images/1.jpeg" alt="Polaroid memory one" /></div>
          <div class="photo-card"><img src="Images/2.jpeg" alt="Polaroid memory two" /></div>
          <div class="photo-card"><img src="Images/3.jpeg" alt="Polaroid memory three" /></div>
          <div class="photo-card"><img src="Images/4.jpeg" alt="Polaroid memory four" /></div>
        </div>

        <div class="page-actions">
          <a class="primary-btn" href="contents.html">Back to Notes</a>
          <a class="primary-btn" href="final.html">Read the Final Message</a>
        </div>
      </section>
    </main>

    <script src="script.js"></script>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Closing Note</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="closing-book">
    <div class="hearts" aria-hidden="true">
      <span class="heart h1">♡</span>
      <span class="heart h2">♥</span>
      <span class="heart h3">♡</span>
    </div>

    <main class="scrapbook-page final-page">
      <section class="page-paper">
        <div class="washi-tape tape-left"></div>
        <div class="washi-tape tape-right"></div>
        <p class="handwritten intro">The book is closing gently</p>
        <h2>Forever in these pages</h2>
        <p class="final-message">
          No matter where life takes us,<br />
          thank you for listening to every piece of my heart.<br /><br />
          Whenever you miss me,<br />
          my voice will always be waiting here.
        </p>
        <p class="signature">Love,<br />Tenisha ❤️</p>

        <div class="page-actions">
          <a class="primary-btn" href="index.html">Back to Cover</a>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>

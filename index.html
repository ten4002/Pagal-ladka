<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Cover page for the romantic scrapbook experience -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Aasif ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="cover-body">
    <div class="hearts" aria-hidden="true">
      <span class="heart h1">♡</span>
      <span class="heart h2">♥</span>
      <span class="heart h3">♡</span>
    </div>
    <div class="petals" aria-hidden="true">
      <span class="petal p1">✿</span>
      <span class="petal p2">❁</span>
      <span class="petal p3">✿</span>
    </div>

    <main class="book-scene">
      <section class="hardcover" aria-label="Scrapbook cover">
        <div class="cover-front">
          <div class="cover-ornaments">
            <span>❀</span>
            <span>✿</span>
            <span>❀</span>
          </div>
          <h1>For Aasif ❤️</h1>
          <p class="subtitle">A Collection of Little Pieces of My Heart</p>
          <button id="openBook" class="primary-btn">Open Scrapbook</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
